version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - revive
    - gocritic
    - misspell
    - unconvert
    - gofumpt
    - goimports
    - exhaustive

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    revive:
      rules:
        - name: exported
        - name: package-comments

    exhaustive:
      default-signifies-exhaustive: true

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

formatters:
  enable:
    - gofumpt
    - goimports

exclusions:
  generated: strict
  rules:
    - path: _test\.go
      linters:
        - errcheck
      text: "Error return value of .* is not checked"

run:
  timeout: 5m
  tests: false
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: true

severity:
  default: error
